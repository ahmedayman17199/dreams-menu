<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dreams Cafe — منيو 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--teal:#2a9fb8;--pink:#e0568f;--green:#5fb446;--red:#d7262e;--ink:#1d2b3a;--muted:#6b7785;--bg:#fbf7f1;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif}
.app{position:relative}
/* ---------- 3D stage ---------- */
.stage{position:sticky;top:0;height:56vh;height:56svh;z-index:5;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 45%,#fff 0%,#fdf3e6 55%,#f4e4cf 100%);
  border-bottom:1px solid #ecdcc6;box-shadow:0 10px 30px -18px rgba(80,50,20,.45)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
#gl:active{cursor:grabbing}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lb{position:absolute;transform:translateY(-50%);white-space:nowrap;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.92);border:1px solid #ead9c2;border-radius:999px;padding:2px 10px 3px;
  box-shadow:0 4px 12px -6px rgba(60,40,20,.35);color:var(--ink)}
.lb b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}
.tabs{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;
  background:rgba(255,255,255,.8);backdrop-filter:blur(6px);padding:4px;border-radius:999px;border:1px solid #eadcc8}
.tabs button{font:inherit;font-size:13px;font-weight:700;border:0;background:none;color:var(--muted);
  padding:4px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.info{position:absolute;right:14px;bottom:12px;z-index:3;max-width:70%}
.info .cat{font-size:12px;font-weight:700;color:var(--pink)}
.info h2{font-size:22px;font-weight:900;line-height:1.2}
.info .price{display:inline-block;margin-top:4px;background:var(--pink);color:#fff;font-weight:800;
  padding:1px 12px 3px;border-radius:10px;font-size:16px}
.hint{position:absolute;left:12px;bottom:14px;font-size:11px;color:var(--muted);z-index:3;
  background:rgba(255,255,255,.75);padding:3px 9px;border-radius:999px}
.fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted)}
/* ---------- list ---------- */
.list{padding:14px 14px 48vh;max-width:640px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;padding:8px 2px 4px}
.brand img{width:66px;height:66px;border-radius:50%;object-fit:cover;mix-blend-mode:multiply}
.brand h1{font-size:22px;font-weight:900;color:var(--teal);line-height:1.1}
.brand p{font-size:13px;color:var(--muted)}
.cathead{display:flex;align-items:center;gap:10px;margin:26px 2px 10px;font-size:20px;font-weight:900;scroll-margin-top:60vh}
.cathead::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,transparent,currentColor);opacity:.25}
.card{position:relative;display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;
  padding:10px;margin:12px 0;border:1px solid #efe3d3;min-height:132px;
  transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s,box-shadow .45s,filter .45s;
  opacity:.5;transform:scale(.95);filter:saturate(.75)}
.card.active{opacity:1;transform:scale(1);filter:none;border-color:var(--pink);
  box-shadow:0 14px 34px -16px rgba(224,86,143,.55)}
.ph{flex:0 0 118px;height:108px;border-radius:14px;overflow:hidden;background:#fff;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;transition:opacity .4s,transform .4s}
.ph .live{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;color:var(--pink);opacity:0;transition:opacity .4s;font-size:13px;gap:2px;
  background:repeating-linear-gradient(45deg,#fff5f9 0 8px,#fff 8px 16px)}
.ph .live span{font-size:28px;line-height:1}
.card.active .ph img{opacity:0;transform:scale(.8)}
.card.active .ph .live{opacity:1}
.tx{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tx h3{font-size:17px;font-weight:800;line-height:1.3}
.pr{flex:none;font-weight:900;color:#fff;background:var(--teal);border-radius:9px;padding:0 9px 2px;font-size:15px}
.tx p{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-height:0;overflow:hidden;transition:max-height .5s}
.card.active .chips{max-height:90px}
.chips span{font-size:11px;font-weight:700;background:#fdf0f5;color:var(--pink);padding:1px 8px;border-radius:999px}
.rows{list-style:none;margin-top:6px;columns:1}
.rows li{display:flex;align-items:baseline;gap:6px;font-size:13px;padding:2px 0;break-inside:avoid}
.rows li span{font-weight:700}.rows li small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;direction:ltr;text-align:right}
.rows li i{flex:1;border-bottom:1.5px dotted #d9c7b0;transform:translateY(-3px)}
.rows li b{color:var(--pink);font-weight:900;min-width:24px;text-align:left}
.note{font-size:11.5px;color:var(--teal);font-weight:700;margin-top:6px}
.card.lst{align-items:flex-start}
.card.lst .ph img{object-fit:contain}
@media (min-width:600px){.rows.two{columns:2;column-gap:22px}}
footer{text-align:center;font-size:12px;color:var(--muted);margin-top:30px;letter-spacing:.5px}
/* ---------- desktop ---------- */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:minmax(420px,1fr) 1.25fr}
  .list{grid-column:1;grid-row:1;padding:24px 28px 50vh;max-width:none;width:100%}
  .stage{grid-column:2;grid-row:1;height:100vh;border-bottom:0;border-inline-start:1px solid #ecdcc6}
  .cathead{scroll-margin-top:30vh}
  .info{right:24px;bottom:24px}.info h2{font-size:32px}.info .price{font-size:20px}
  .lb{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <section class="stage" id="stage">
    <canvas id="gl"></canvas>
    <svg id="lines"></svg>
    <div id="labels"></div>
    <div class="tabs" id="tabs"></div>
    <div class="info"><div class="cat" id="iCat"></div><h2 id="iName"></h2><div class="price" id="iPrice"></div></div>
    <div class="hint">↔ اسحب للتدوير</div>
    <div class="fallback" id="fb">العرض الـ 3D مش مدعوم على الجهاز ده</div>
  </section>
  <main class="list" id="list">
    <header class="brand"><img src="img/logo.jpg" alt="Dreams Cafe"><div><h1>Dreams Cafe</h1><p>منيو تفاعلي: اعمل scroll وكل أكلة هتظهرلك 3D بمكوناتها</p></div></header>
    <div id="items"></div>
    <footer>DREAMS CAFE • COFFEE • JUICE • SANDWICHES • SINCE 2025</footer>
  </main>
</div>

 sujuk:ctx=>scatter(ctx,16,()=>{const m=new THREE.Mesh(geo('suj',()=>new THREE.CylinderGeometry(.1,.1,.06,18)),mat(pick(['#7a2a1d','#8c3324']),.6));return m}),

 kabutsha:ctx=>scatter(ctx,40,()=>new THREE.Mesh(geo('kab',()=>new THREE.BoxGeometry(.2,.016,.022)),mat(pick(['#8e3b8a','#a64ea1','#f1ecdf']),.6))),
 mixedVeg:ctx=>scatter(ctx,26,()=>new THREE.Mesh(geo('veg',()=>new THREE.BoxGeometry(.07,.07,.07)),mat(pick(['#7cb342','#f2c230','#e67e22','#d8342b']),.55))),
 jalapeno:ctx=>scatter(ctx,10,()=>new THREE.Mesh(geo('jal',()=>new THREE.TorusGeometry(.085,.035,8,16)),mat(pick(['#3c8d2f','#4ca33a']),.4))),
 liquid:(ctx,s)=>{const L=new THREE.Group();const y=ctx.y0+s.at*ctx.h;
   const g=new THREE.CylinderGeometry(ctx.Rat(y+s.h/2)*.95,ctx.Rat(y-s.h/2)*.95,s.h,40);
   const m=new THREE.Mesh(g,s.op?new THREE.MeshStandardMaterial({color:s.col,roughness:.2,transparent:true,opacity:s.op,depthWrite:false}):mat(s.col,.25));
   m.userData.cy=0;m.userData.ey=0;L.add(m);return L;},

   const m=new THREE.Mesh(g,mat(s.col,s.col==='#c8202a'?.2:.7));m.userData.cy=0;m.userData.ey=0;L.add(m);return L;},
 fruit:(ctx,s)=>scatter(ctx,s.big?11:16,()=>new THREE.Mesh(geo(s.big?'fbig':'fsm',()=>new THREE.BoxGeometry(s.big?.15:.1,s.big?.13:.09,s.big?.15:.1)),mat(pick(s.cols),.45)),{spread:s.spread||.04}),
 mint:(ctx,s)=>scatter(ctx,7,()=>{const m=new THREE.Mesh(geo('leaf',()=>{const g=new THREE.SphereGeometry(.1,12,8);g.scale(1,.16,.55);return g}),mat(pick(['#3b8d2f','#4fa23a']),.5));return m},{spread:s.spread||.05}),
 lime:(ctx,s)=>scatter(ctx,3,()=>{const m=new THREE.Mesh(geo('lime',()=>new THREE.CylinderGeometry(.16,.16,.035,22)),mat(pick(['#a8d34a','#c5e36a']),.4));m.rotation.x=Math.PI/2;return m},{spread:s.spread||.04}),
 ice:(ctx,s)=>scatter(ctx,7,()=>new THREE.Mesh(geo('ice',()=>new THREE.BoxGeometry(.17,.17,.17)),new THREE.MeshStandardMaterial({color:0xe6f6ff,transparent:true,opacity:.6,roughness:.05})),{spread:s.spread||.05}),
 bubbles:(ctx,s)=>scatter(ctx,30,()=>new THREE.Mesh(geo('bub',()=>new THREE.SphereGeometry(.028,8,6)),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.55,roughness:.1})),{spread:s.spread||.05}),

   const b=new THREE.Mesh(geo('stb',()=>{const c=new THREE.ConeGeometry(.11,.22,14);c.rotateX(Math.PI);return c}),mat('#d42a2a',.35));
   const l=new THREE.Mesh(geo('stl',()=>new THREE.ConeGeometry(.08,.05,6)),mat('#3b8d2f'));l.position.y=.12;g.add(b);g.add(l);return g},{spread:s.spread||.03}),
 cream:(ctx,s)=>{const L=new THREE.Group();for(let i=0;i<4;i++){const t=new THREE.Mesh(geo('cr'+i,()=>new THREE.TorusGeometry(.34-i*.08,.1-i*.012,12,32)),mat('#fffaf0',.55));
   t.rotation.x=Math.PI/2;t.position.y=i*.11;t.userData.cy=i*.11;t.userData.ey=i*.06;L.add(t);}
   const tip=new THREE.Mesh(geo('crt',()=>new THREE.ConeGeometry(.08,.16,12)),mat('#fffaf0',.55));tip.userData.cy=.48;tip.userData.ey=.26;L.add(tip);return L;},
 spiral:(ctx,s)=>{const pts=[];for(let k=0;k<=60;k++){const t=k/60,a=t*Math.PI*6,r=.38*(1-t)+.04;pts.push(new THREE.Vector3(Math.cos(a)*r,t*.42,Math.sin(a)*r));}
   const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),160,.022,6),mat(s.col,.3));m.userData.cy=-.22;m.userData.ey=-.15;const L=new THREE.Group();L.add(m);return L;},

   w.position.set(x,.1,0);w.rotation.z=r;w.userData.cy=.1;w.userData.ey=0;L.add(w);});
   const o=new THREE.Mesh(geo('oreo',()=>new THREE.CylinderGeometry(.12,.12,.05,24)),mat('#2a1a12',.6));o.position.set(-.25,0,.1);o.rotation.x=1.2;o.userData.cy=0;o.userData.ey=0;L.add(o);return L;},
 beans:(ctx,s)=>scatter(ctx,9,()=>new THREE.Mesh(geo('bean',()=>{const g=new THREE.SphereGeometry(.05,10,8);g.scale(1,.6,1.45);return g}),mat('#4a2a16',.4)),{spread:.02}),

};

/* ---------- build model ---------- */
let model=null,builtAt=0,dragRot=0;
const labelsEl=document.getElementById('labels'),linesEl=document.getElementById('lines');
function dispose(){if(!model)return;scene.remove(model.root);labelsEl.innerHTML='';linesEl.innerHTML='';}
function build(i){
  dispose();const it=ITEMS[i];const {g,ctx}=makeShell(it.shell);
  const root=new THREE.Group(),inner=new THREE.Group();root.add(inner);
  const layers=[];const n=it.ing.length;
  it.ing.forEach((raw,j)=>{const sp=typeof raw==='string'?{k:raw}:raw;const k=sp.k;const L=ING[k](ctx,sp);L.userData.key=k;L.userData.sp=sp;
    const side=L.userData.side;
    L.userData.cy=ctx.drink?ctx.y0+sp.at*ctx.h:side?ctx.sideY:ctx.cy0+(n-1-j)*ctx.stack;
    if(ctx.drink)L.userData.h=(k==='liquid'&&sp.h>.7)||k==='cream'?1.3:(k==='wedge'&&sp.h>.3)?1.2:1;
    if(side){L.userData.cx=side*(ctx.W+.55);L.userData.cz=.35;}
    inner.add(L);layers.push(L);});
  g.userData.key='_shell';g.userData.cy=0;g.userData.h={bag:2.4,box:1.5,crepe:2.1,wrap:1.9,glass:2.2,jar:2.1,cup:2.4,mug:1.5,teaGlass:1.4,plate:.8}[it.shell];inner.add(g);layers.push(g);
  layers.forEach(L=>{if(!L.userData.h)L.userData.h=(L.userData.key==='fries'&&ctx.bag)?2.1:L.userData.side?1.1:1;});
  let cum=0;layers.forEach(L=>{L.userData.mid=cum+L.userData.h/2;cum+=L.userData.h;});
  const lab=[];
  layers.forEach((L,j)=>{const d=document.createElement('div');d.className='lb';
    const k=L.userData.key,sp=L.userData.sp||{};d.innerHTML=`<b style="background:${k==='_shell'?'#caa274':(sp.col||(sp.cols&&sp.cols[0])||DOT[k]||'#e0568f')}"></b>${k==='_shell'?SHELL_LABEL[it.shell]:(sp.l||LABEL[k])}`;
    labelsEl.appendChild(d);const ln=document.createElementNS('http://www.w3.org/2000/svg','path');
    ln.setAttribute('fill','none');ln.setAttribute('stroke','#b89a78');ln.setAttribute('stroke-width','1.2');ln.setAttribute('stroke-dasharray','3 3');
    const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('r','3.2');dot.setAttribute('fill','#e0568f');
    linesEl.appendChild(ln);linesEl.appendChild(dot);lab.push({d,ln,dot,w:0});});
  scene.add(root);
  model={root,inner,layers,ctx,lab,it,total:cum,gap:Math.min(.55,4.6/cum)};
  builtAt=performance.now();dragRot=0;
}

/* ---------- drag ---------- */
let dragging=false,lx=0,vel=0;
canvas.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;vel=0;});
addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lx;lx=e.clientX;vel=dx*.012;dragRot+=vel;});
addEventListener('pointerup',()=>dragging=false);addEventListener('pointercancel',()=>dragging=false);

/* ---------- loop ---------- */
let W=0,H=0,eCur=0;const v3=new THREE.Vector3(),v4=new THREE.Vector3();
function resize(){const r=stageEl.getBoundingClientRect();if(r.width===W&&r.height===H)return;W=r.width;H=r.height;
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();linesEl.setAttribute('viewBox',`0 0 ${W} ${H}`);}
const ease=t=>{const c=1.4;t=Math.min(1,t);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const lerp=(a,b,t)=>a+(b-a)*t;
function frame(now){
  resize();
  const a=readScroll();if(a!==active||!model){active=a;setActive(a);build(a);}
  const target=Math.max(0,Math.min(1,(Math.sin(progress*Math.PI)-.12)*1.7));
  eCur+=(target-eCur)*.09;const e=eCur;
  const {root,inner,layers,ctx,lab,gap}=model;const N=layers.length;
  const Ht=model.total*gap;
  layers.forEach((L,j)=>{
    const ey=Ht/2-L.userData.mid*gap;
    L.position.y=lerp(L.userData.cy,ey,e);
    if(L.userData.side){L.position.x=lerp(L.userData.cx,0,e);L.position.z=lerp(L.userData.cz,0,e);}
    if(j<N-1)L.children.forEach(m=>{if(m.userData.cy!==undefined)m.position.y=lerp(m.userData.cy,m.userData.ey,e);});
  });
  if(!dragging){dragRot*=.985;dragRot+=vel;vel*=.92;}
  const t=now/1000;
  inner.rotation.y=(ctx.type==='crepe'?-.35:ctx.type==='wrap'?-.2:ctx.type==='plate'?-.9:.25)+Math.sin(t*.5)*.45*(1-e*.75)+dragRot;
  inner.rotation.x=lerp(0,.08,e);
  const pop=ease((now-builtAt)/650);root.scale.setScalar(.55+.45*pop);
  // camera framing
  const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2)),asp=W/H;const narrow=asp<1.25;
  const modelW=ctx.W*2+.5;
  const d0=Math.max(({bag:3.3,box:2.7,glass:2.6,jar:2.6,cup:3.0,mug:2.0,teaGlass:1.9,plate:2.0}[ctx.type]||2.5)/(2*tan),(modelW+1.6)/(2*tan*asp));
  const d1=Math.max((Ht+2.3)/(2*tan),(modelW/(narrow?.52:.62))/(2*tan*asp));
  const dist=lerp(d0,d1,e),elev=lerp(.5,.16,e);
  camera.position.set(0,Math.sin(elev)*dist,Math.cos(elev)*dist);camera.lookAt(0,lerp(-.3,-(Ht*.02+.2),e),0);
  const visW=2*dist*tan*asp;
  root.position.x=narrow?lerp(0,visW*.2,e):0; // RTL: labels on left side on narrow screens, model to the right
  shadow.position.set(root.position.x,lerp(ctx.bottom-.02,-Ht/2-.75,e),0);shadow.material.opacity=1-e*.5;
  renderer.render(scene,camera);
  // labels
  const op=Math.max(0,(e-.35)/.5);
  lab.forEach((l,j)=>{
    const L=layers[j];L.getWorldPosition(v3);v4.copy(v3);v4.x+=(narrow?-1:(j%2?-1:1))*ctx.W*.5*root.scale.x;
    v4.project(camera);const sx=(v4.x+1)/2*W,sy=(1-v4.y)/2*H;
    const side=narrow?-1:(j%2?-1:1);
    if(!l.w)l.w=l.d.offsetWidth;
    let lx=side>0?sx+34:sx-34-l.w;lx=Math.max(6,Math.min(W-l.w-6,lx));
    const ly=sy;
    l.d.style.left=lx+'px';l.d.style.top=ly+'px';l.d.style.opacity=op;
    const ex=side>0?lx:lx+l.w;
    l.ln.setAttribute('d',`M${sx},${sy} L${ex},${ly}`);l.ln.style.opacity=op;
    l.dot.setAttribute('cx',sx);l.dot.setAttribute('cy',sy);l.dot.style.opacity=op;
  });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
